name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions requises par l'action de déploiement GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un push plus récent annule celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Bascule GitHub Pages en source « GitHub Actions » (avec le token du workflow),
      # sans dépendre d'un réglage manuel dans les paramètres du dépôt.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build (export statique dans out/)
        run: npm run build
        env:
          # Sous-chemin de la GitHub Page projet (digitalforbiness.github.io/A7).
          # À vider lors du passage à un domaine personnalisé à la racine.
          NEXT_PUBLIC_BASE_PATH: /A7

      # `_next/` commence par un underscore : sans .nojekyll, GitHub Pages
      # (Jekyll) l'ignorerait et casserait tout le JS/CSS. Fourni via public/,
      # on le retouche ici par sécurité.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
